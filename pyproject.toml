[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalcore"
version = "0.1.0"
description = "Headless, configuration-driven evaluation platform (prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evalcore = "evalcore.cli:main"

[tool.setuptools.packages.find]
include = ["evalcore*"]

[tool.setuptools.package-data]
evalcore = ["schema/*.json"]
